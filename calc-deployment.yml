apiVersion: apps/v1
kind: Deployment
metadata:
  name: calc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calc
  template:
    metadata:
      labels:
        app: calc
    spec:
      containers:
        - name: calc
          image: local/calc:latest
          imagePullPolicy: Never   # Critical: use only the local image, don't pull from registry
          command: ["sleep", "infinity"]
          env:
            - name: DB_HOST
              value: postgres-service
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: calc
            - name: DB_PASSWORD
              value: password
            - name: DB_NAME
              value: calc

